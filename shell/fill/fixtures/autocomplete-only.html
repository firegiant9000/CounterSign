<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example Robotics - Quick contact</title>
  </head>
  <body>
    <form action="https://example.com/contact" method="post">
      <input type="hidden" name="campaign" value="hidden-campaign-9" />
      <input type="text" placeholder="Your name" autocomplete="name" />
      <input type="text" placeholder="Your email" autocomplete="email" />
      <input type="text" placeholder="Your phone" autocomplete="tel" />
      <input
        type="text"
        placeholder="Street address"
        autocomplete="address-line1"
      />
      <input type="text" placeholder="City" autocomplete="address-level2" />
      <input type="text" placeholder="State" autocomplete="address-level1" />
      <input type="text" placeholder="Postal code" autocomplete="postal-code" />
      <input type="text" placeholder="Country" autocomplete="country-name" />
      <input
        type="text"
        placeholder="Given name"
        autocomplete="section-a shipping given-name"
      />
      <input type="text" placeholder="Card number" autocomplete="cc-number" />
      <input
        type="text"
        placeholder="Code from your phone"
        autocomplete="one-time-code"
      />
      <input
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />
      <button type="submit">Send</button>
    </form>
  </body>
</html>
