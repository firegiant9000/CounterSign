<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example Robotics - Apply for Robotics Engineer</title>
  </head>
  <body>
    <h1>Apply for Robotics Engineer at Example Robotics</h1>
    <form action="https://example.com/apply" method="post">
      <input type="hidden" name="token" value="hidden-token-7731" />
      <ul>
        <li>
          <label>
            <span class="application-label">Full name</span>
            <input type="text" name="name" required />
          </label>
        </li>
        <li>
          <label>
            <span class="application-label">Email</span>
            <input type="email" name="email" />
          </label>
        </li>
        <li>
          <div class="application-label">Phone</div>
          <input type="tel" name="phone" />
        </li>
        <li>
          <div class="application-label">Current location</div>
          <input type="text" name="location" aria-autocomplete="list" />
        </li>
        <li>
          <div class="application-label">LinkedIn URL</div>
          <input type="text" name="urls[LinkedIn]" />
        </li>
        <li>
          <div class="application-label">Resume/CV</div>
          <input type="file" name="resume" />
        </li>
        <li>
          <div class="application-label">
            Are you legally authorized to work in the United States?
          </div>
          <select name="authorized">
            <option value="">Choose one</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </li>
        <li>
          <div class="application-label">
            Will you now or in the future require visa sponsorship?
          </div>
          <ul>
            <li>
              <label
                ><input type="checkbox" name="sponsorship" value="yes" />
                Yes</label
              >
            </li>
            <li>
              <label
                ><input type="checkbox" name="sponsorship" value="no" />
                No</label
              >
            </li>
          </ul>
        </li>
        <li>
          <div class="application-label">Additional information</div>
          <textarea name="comments"></textarea>
        </li>
      </ul>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
